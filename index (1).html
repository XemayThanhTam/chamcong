<style>
:root{--g:#12a150;--g2:#0e8a44;--gl:#e7f6ed;--bg:#f3f5f7;--card:#fff;--tx:#14213d;--mu:#6b7686;--bd:#e3e7ec;--rd:#e5484d;--rdl:#fdecec;--or:#f08c00;--orl:#fff4e0;--bl:#2f6fed;--bll:#e8f0fe;--yl:#d9a400;--yll:#fff8d6;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
.hd{background:var(--g);color:#fff;padding:18px 16px 54px;position:relative}
.hd .cty{font-weight:700;font-size:17px}
.hd .who{opacity:.85;font-size:13px;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.wrap{max-width:720px;margin:-40px auto 0;padding:0 14px 100px;position:relative}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(20,33,61,.07);margin-bottom:12px}
.h2{font-size:17px;font-weight:700;margin:4px 2px 10px}
.mu{color:var(--mu)} .sm{font-size:13px} .b{font-weight:700} .c{text-align:center} .r{text-align:right}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;font-weight:600;background:var(--g);color:#fff}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)} .btn.d{background:var(--rd)} .btn.gr{background:#eef1f4;color:var(--tx)}
.btn svg{width:20px;height:20px;flex:none}
.btn.sm{padding:7px 12px;font-size:13px} .btn.w{width:100%} .btn:disabled{opacity:.5}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);padding:4px 0;position:relative}
.nav button svg{width:23px;height:23px} .nav button.on{color:var(--g);font-weight:600}
.badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--rd);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:17px}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.punch div{background:var(--bg);border-radius:12px;padding:12px}
.punch .t{font-size:22px;font-weight:700}
.big{width:168px;height:168px;border-radius:50%;margin:8px auto 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--g);color:#fff;font-size:19px;font-weight:700;box-shadow:0 0 0 10px var(--gl),0 8px 20px rgba(18,161,80,.35)}
.big.ra{background:var(--or);box-shadow:0 0 0 10px var(--orl),0 8px 20px rgba(240,140,0,.3)}
.big.xong{background:#9aa5b1;box-shadow:0 0 0 10px #eef1f4}
.big svg{width:42px;height:42px;margin-bottom:4px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px}
.msg.ok{background:var(--gl);color:var(--g2)} .msg.er{background:var(--rdl);color:var(--rd)} .msg.wn{background:var(--orl);color:#9a5a00}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,33,61,.07);overflow-x:auto}
.tabs button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--gl);color:var(--g2);font-weight:700}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat .v{font-size:19px;font-weight:700} .stat .l{font-size:11.5px;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:10px}
.cal .w{font-size:12px;color:var(--mu);padding:4px 0}
.cal .d{padding:7px 0 5px;border-radius:10px;font-size:14px}
.cal .d.sel{background:var(--gl);font-weight:700}
.cal .d i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.dot-du{background:var(--g)!important}.dot-muon{background:var(--or)!important}.dot-phep{background:var(--bl)!important}.dot-khong-luong,.dot-vang{background:var(--rd)!important}.dot-thieu{background:var(--yl)!important}.dot-bu{background:#7048e8!important}.dot-dang-lam{background:#8fd3a8!important}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--c)}
.don{padding:14px 16px}
.don .lo{font-size:13px;font-weight:700;color:var(--g)}
.don .lo.kl,.don .lo.mua{color:var(--or)} .don .lo.ung{color:#7048e8} .don .lo.bu{color:#0b7285}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin-top:8px}
.kv dt{color:var(--mu)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px}
.p-cho{background:var(--orl);color:#9a5a00}.p-duyet{background:var(--gl);color:var(--g2)}.p-tuchoi{background:var(--rdl);color:var(--rd)}.p-huy{background:#eef1f4;color:var(--mu)}
.acts{display:flex;border-top:1px solid var(--bd);margin:12px -16px -14px}
.acts button{flex:1;padding:12px;font-weight:600}
.acts .no{color:var(--rd)} .acts .yes{color:var(--g)} .acts button+button{border-left:1px solid var(--bd)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;font-size:30px;box-shadow:0 6px 16px rgba(18,161,80,.4);z-index:15}
.ps .ln{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--bd)}
.ps .ln:last-child{border:0}
.ps .ln.tot{font-weight:700} .ps .ln.fin{font-weight:800;color:var(--g2);font-size:17px}
.ps .ln.tru span:last-child{color:var(--rd)}
.ov{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{border:1.5px solid var(--bd);border-radius:10px;padding:10px 8px;font-size:14px;text-align:left}
.chips button:last-child:nth-child(odd){grid-column:span 2}
.chips button.on{border-color:var(--g);background:var(--gl);color:var(--g2);font-weight:600}
.chips button small{display:block;color:var(--mu);font-weight:400;font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:block}
.flow{border-left:2px solid var(--g);margin:6px 0 0 6px;padding-left:14px;font-size:14px}
.flow div{position:relative;padding:3px 0}
.flow div::before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--g)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;font-size:13px;min-width:1200px;width:100%}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:right}
.tbl th{background:#f7f9fa;color:var(--mu);font-weight:600;position:sticky;top:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;white-space:normal;min-width:150px;max-width:180px;box-shadow:2px 0 4px rgba(20,33,61,.06)}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:#fff;z-index:1}
.tbl input{padding:5px 6px;width:96px;text-align:right;border-radius:6px;font-size:13px}
.tbl input.n{width:62px} .tbl input.t{width:130px;text-align:left}
.tbl tfoot td{font-weight:700;background:#f7f9fa}
.list .it{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.list .it:last-child{border:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--gl);color:var(--g2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.load{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:60;display:none;align-items:center;justify-content:center}
.spin{width:38px;height:38px;border:4px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;max-width:90vw;display:none}
.toast.er{background:var(--rd)}
.warn{color:var(--rd);font-size:12.5px}
.ti-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;text-align:center;line-height:1.3}
.ti-ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff}
.ti-ic svg{width:28px;height:28px}
.tkc{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.tkc .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tkc .ic svg{width:26px;height:26px}
.tkc .v{font-size:24px;font-weight:700;line-height:1.2}
.chev{color:var(--mu);font-size:22px}
.filt{display:flex;gap:8px;margin-bottom:12px}
.filt input,.filt select{background:#fff;border-radius:22px;padding:9px 14px;font-size:14px}
.pbrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--bd);text-align:left}
.pbrow svg{width:24px;height:24px;color:var(--g);flex:none}
.pbmem{padding-left:12px;border-left:2px solid var(--gl);margin:2px 0 8px 10px}
a.tel{color:var(--bl);text-decoration:none}
@media(min-width:760px){.wrap{padding-bottom:110px}}
.hd{padding-top:calc(18px + env(safe-area-inset-top))}
.otp{font-size:28px;letter-spacing:10px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="hd"><div class="cty" id="cty">Chấm công</div><div class="who" id="who">Đang tải…</div></div>
<div class="wrap" id="main"><div class="card empty">Đang kết nối máy chủ…</div></div>
<nav class="nav" id="nav" style="display:none"></nav>
<div class="load" id="load"><div class="spin"></div></div>
<div class="toast" id="toast"></div>
<div id="modal"></div>

<script>
/* ===== HẠ TẦNG ===== */
var CFG = window.CC_CONFIG || {}, BE = CFG.BACKEND_URL || '';
var KEY_PHIEN = 'tt_cc_phien';
function layPhien() { try { return localStorage.getItem(KEY_PHIEN) || ''; } catch (e) { return ''; } }
function luuPhien(v) { try { if (v) localStorage.setItem(KEY_PHIEN, v); else localStorage.removeItem(KEY_PHIEN); } catch (e) { } }
var S = { tab: 'home' };
var LOAI = { PHEP: 'Nghỉ phép', KL: 'Nghỉ không lương', MUA: 'Đi muộn trời mưa', BU: 'Bù công', UNG: 'Tạm ứng' };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function tien(n) { return Math.round(Number(n) || 0).toLocaleString('vi-VN'); }
function so(n, d) { return (Number(n) || 0).toLocaleString('vi-VN', { maximumFractionDigits: d == null ? 2 : d }); }
function ngayVN(s) { if (!s) return ''; var p = s.slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function kyVN(k) { return k ? 'Tháng ' + k.slice(5) + '/' + k.slice(0, 4) : ''; }
function thu(s) { var p = s.split('-'); return ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'][new Date(+p[0], p[1] - 1, +p[2]).getDay()]; }
function kyNay() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function doiKy(k, n) { var p = k.split('-').map(Number); var d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function loading(on) { $('load').style.display = on ? 'flex' : 'none'; }
var tTimer;
function toast(m, er) { var t = $('toast'); t.textContent = m; t.className = 'toast' + (er ? ' er' : ''); t.style.display = 'block'; clearTimeout(tTimer); tTimer = setTimeout(function () { t.style.display = 'none'; }, 3800); }
/* Gọi máy chủ (Google Sheets) kèm phiên đăng nhập lưu trên máy */
function goi(action, data) {
  if (!BE || BE.indexOf('https://') !== 0) return Promise.reject(new Error('Chưa cấu hình BACKEND_URL trong config.js.'));
  return fetch(BE, { method: 'POST', redirect: 'follow', body: JSON.stringify({ session: layPhien(), action: action, data: data || {} }) })
    .then(function (r) { return r.text(); }, function () { throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); })
    .then(function (t) { if (t.charAt(0) !== '{') throw new Error('Máy chủ phản hồi lỗi, thử lại sau ít phút.'); return t; });
}
function call(action, data, quiet) {
  if (!quiet) loading(true);
  return goi(action, data).then(function (t) {
    loading(false);
    var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Phản hồi không hợp lệ'); }
    if (j.ok) return j.data;
    if (/Phiên đăng nhập hết hạn|chưa được khai báo/.test(j.error || '') && action !== 'guiMa' && action !== 'xacNhanMa') { dangXuat(j.error); throw new Error(j.error); }
    throw new Error(j.error);
  }, function (e) { loading(false); throw e; });
}
function maThietBi() {
  var k = 'tt_cc_device';
  try { var v = localStorage.getItem(k); if (v) return v; v = 'TB-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); localStorage.setItem(k, v); return v; }
  catch (e) { return ''; }
}
var IC = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  don: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  luong: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M7 10v5M17 10v5"/></svg>',
  ql: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  tree: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="12" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v9M5 16.5V13h14v3.5"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 12l3-3 3 2 4-4M12 16v4M8 20h8"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  late: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  leave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l4-4-4-4M14 12H4"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};

/* ===== KHỞI ĐỘNG NHANH =====
 * 1) Bật GPS ngay khi mở app (chạy song song lúc chờ máy chủ) → bấm chấm công là có vị trí sẵn.
 * 2) Hiện ngay giao diện lần trước (lưu trên máy), máy chủ trả về thì cập nhật lại.
 *    Giờ chấm và Vào/Ra ca vẫn do máy chủ quyết định nên không ảnh hưởng dữ liệu. */
var KEY_INIT = 'tt_cc_init';
function ngayMay() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function docCacheInit() {
  try {
    var d = JSON.parse(localStorage.getItem(KEY_INIT) || 'null');
    if (!d || !d.me || !d.homNay) return null;
    var hn = ngayMay();
    if (d.homNay.ngay !== hn) d.homNay = { ngay: hn, vao: '', ra: '' };
    return d;
  } catch (e) { return null; }
}
function luuCacheInit() { try { var c = Object.assign({}, S.init); delete c.tk; localStorage.setItem(KEY_INIT, JSON.stringify(c)); } catch (e) { } }   // không lưu số tài khoản trên máy
function hienKhung() {
  var d = S.init;
  $('cty').textContent = d.cty;
  $('who').textContent = d.me.ten + ' · ' + d.me.ma + ' · ' + d.me.pb + (S.cu ? ' · đang cập nhật…' : '');
  veNav();
}
/* ===== ĐĂNG NHẬP BẰNG MÃ EMAIL ===== */
function dangXuat(lyDo) {
  luuPhien(''); try { localStorage.removeItem(KEY_INIT); localStorage.removeItem('tt_cc_tb'); localStorage.removeItem('tt_cc_tbtk'); } catch (e) { }
  S = { tab: 'home' }; tatGPS(); veDangNhap(lyDo);
}
function veDangNhap(lyDo, email) {
  $('nav').style.display = 'none'; $('cty').textContent = 'Chấm công Thành Tâm'; $('who').textContent = 'Đăng nhập';
  var em = email || (function () { try { return localStorage.getItem('tt_cc_email') || ''; } catch (e) { return ''; } })();
  $('main').innerHTML = '<div class="card">' + (lyDo ? '<div class="msg wn" style="margin-bottom:10px">' + esc(lyDo) + '</div>' : '') +
    '<div class="b" style="font-size:18px">Đăng nhập</div><div class="mu sm" style="margin-top:4px">Nhập email bạn đã đăng ký với Kế toán. App sẽ gửi mã 6 số về email đó.</div>' +
    '<label class="f">Email</label><input id="lgEmail" type="email" inputmode="email" autocomplete="email" placeholder="ten@gmail.com" value="' + esc(em) + '">' +
    '<div id="lgMaBox" style="display:none"><label class="f">Mã 6 số trong email</label><input id="lgMa" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">' +
      '<div class="sm mu" style="margin-top:6px">Không thấy email? Xem thư mục <b>Spam / Quảng cáo</b>, hoặc <a href="#" onclick="guiMa();return false" style="color:var(--bl)">gửi lại mã</a>.</div></div>' +
    '<div id="lgMsg"></div><button class="btn w" style="margin-top:16px" id="lgBtn" onclick="guiMa()">Gửi mã</button></div>';
}
function guiMa() {
  var email = $('lgEmail').value.trim().toLowerCase();
  if (!email) return $('lgMsg').innerHTML = '<div class="msg er">Nhập email.</div>';
  $('lgBtn').disabled = true;
  call('guiMa', { email: email }).then(function () {
    try { localStorage.setItem('tt_cc_email', email); } catch (e) { }
    $('lgMaBox').style.display = 'block'; $('lgMa').focus();
    $('lgMsg').innerHTML = '<div class="msg ok">Đã gửi mã tới <b>' + esc(email) + '</b>.</div>';
    $('lgBtn').textContent = 'Đăng nhập'; $('lgBtn').onclick = xacNhanMa; $('lgBtn').disabled = false;
  }).catch(function (e) { $('lgBtn').disabled = false; $('lgMsg').innerHTML = '<div class="msg er">' + esc(e.message) + '</div>'; });
}
function xacNhanMa() {
  var ma = $('lgMa').value.replace(/\D/g, '');
  if (ma.length !== 6) return $('lgMsg').innerHTML = '<div class="msg er">Nhập đủ 6 số.</div>';
  $('lgBtn').disabled = true;
  call('xacNhanMa', { email: $('lgEmail').value.trim().toLowerCase(), ma: ma }).then(function (r) {
    luuPhien(r.session); batDau();
  }).catch(function (e) { $('lgBtn').disabled = false; $('lgMsg').innerHTML = '<div class="msg er">' + esc(e.message) + '</div>'; });
}

function batDau() {
  if (!layPhien()) return veDangNhap();
  batGPS();
  var c = docCacheInit();
  if (c) { S.init = c; S.cu = true; hienKhung(); chuyen('home'); }
  call('khoiTao', null, !!c).then(function (d) {
    var m = S.chamMoi;   // lượt vừa chấm trong lúc chờ máy chủ → giữ lại
    if (m && m.ngay === d.homNay.ngay) {
      if (m.vao && !d.homNay.vao) d.homNay.vao = m.vao;
      if (m.ra && (!d.homNay.ra || m.ra > d.homNay.ra)) d.homNay.ra = m.ra;
    }
    var lanDau = !c;
    S.init = d; S.cu = false; luuCacheInit();
    hienKhung();
    if (lanDau) chuyen('home');
    else if (S.tab === 'home' && !S.dangCham && !S.chamMoi) veHome();
  }).catch(function (e) {
    S.cu = false;
    $('nav').style.display = 'none';
    if (!layPhien()) return;   // đã chuyển sang màn đăng nhập
    $('main').innerHTML = '<div class="card"><div class="msg er">' + esc(e.message) + '</div>' +
      '<button class="btn w" style="margin-top:12px" onclick="location.reload()">Thử lại</button></div>';
    $('who').textContent = '';
  });
}
function veNav() {
  var q = S.init.quyen, n = S.init.soChoDuyet;
  var it = [['home', 'Chấm công', IC.home], ['lich', 'Lịch công', IC.cal], ['don', 'Đơn từ', IC.don, n], ['luong', 'Phiếu lương', IC.luong]];
  if (q.duyet) it.push(['ti', 'Tiện ích', IC.grid]);
  $('nav').innerHTML = it.map(function (x) {
    return '<button data-t="' + x[0] + '" class="' + (S.tab === x[0] ? 'on' : '') + '" onclick="chuyen(\'' + x[0] + '\')">' + x[2] + x[1] + (x[3] ? '<span class="badge">' + x[3] + '</span>' : '') + '</button>';

function chuyen(t) {
  S.tab = t;

  window.scrollTo(0, 0);
  ({ home: veHome, lich: veLich, don: veDon, luong: veLuong, ti: veTI })[t]();

    msg.innerHTML = '<div class="msg wn">Đang gửi chấm công…</div>';
    call('chamCong', { lat: f.lat, lng: f.lng, acc: f.acc, deviceId: maThietBi(), ua: navigator.userAgent }).then(function (r) {
      S.dangCham = false;

      S.chamMoi = S.chamMoi && S.chamMoi.ngay === hn.ngay ? S.chamMoi : { ngay: hn.ngay };
      if (r.loai === 'Vào ca') { hn.vao = r.gio; S.chamMoi.vao = r.gio; } else { hn.ra = r.gio; S.chamMoi.ra = r.gio; }
      luuCacheInit();

    }).catch(function (e) { S.dangCham = false; btn.disabled = false; msg.innerHTML = '<div class="msg er">' + esc(e.message) + '</div>'; });
  }, function (err) {

    var t = err.code === 1 ? 'Bạn đã chặn quyền vị trí. Vào Cài đặt trình duyệt → cho phép Vị trí cho trang này rồi tải lại.'
      : err.code === 3 ? 'Lấy vị trí quá lâu. Bật GPS / Vị trí chính xác và thử lại.' : 'Không lấy được vị trí: ' + (err.message || '');
    msg.innerHTML = '<div class="msg er">' + esc(t) + '</div>';

/* ===== GPS CHẠY NỀN =====
 * Dò vị trí liên tục khi đang ở màn Chấm công. Điện thoại đứng yên thì vị trí không đổi,
 * nên bản dò trong 2 phút gần nhất vẫn dùng được; di chuyển thì GPS tự cập nhật bản mới. */
var GPS = { id: null, fix: null, cho: [] };
function gpsMax() { return (S.init && S.init.gpsMax) || 40; }
function gpsSan() { var f = GPS.fix; return !!(GPS.id !== null && f && Date.now() - f.t < 120000 && f.acc <= gpsMax()); }
function veGPS() {
  var el = $('gpsSt'); if (!el) return;
  var f = GPS.fix;
  if (GPS.loi && GPS.loi.code === 1) el.innerHTML = '<span style="color:var(--rd)">Chưa cho phép vị trí</span>';
  else if (gpsSan()) el.innerHTML = '<span style="color:var(--g)">● GPS sẵn sàng</span> · sai số ' + Math.round(f.acc) + ' m';
  else if (f) el.innerHTML = '<span style="color:var(--or)">● Đang dò GPS</span> · sai số ' + Math.round(f.acc) + ' m';
  else el.innerHTML = '<span style="color:var(--or)">● Đang dò GPS…</span>';
}
function batGPS() {
  if (!navigator.geolocation || GPS.id !== null) return;
  GPS.loi = null;
  try {
    GPS.id = navigator.geolocation.watchPosition(function (p) {
      var f = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
      // Giữ bản chính xác hơn trong 15 giây; quá 15 giây thì lấy bản mới nhất
      if (!GPS.fix || f.acc <= GPS.fix.acc || f.t - GPS.fix.t > 15000) GPS.fix = f;
      veGPS();
      if (GPS.cho.length && GPS.fix.acc <= gpsMax()) { var q = GPS.cho; GPS.cho = []; q.forEach(function (w) { w.ok(GPS.fix); }); }
    }, function (err) {
      GPS.loi = err; veGPS();
      if (err.code === 1) {
        tatGPS();
        var q = GPS.cho; GPS.cho = []; q.forEach(function (w) { w.fail(err); });
      }
    }, { enableHighAccuracy: true, maximumAge: 0 });
  } catch (e) { GPS.id = null; }
}
function tatGPS() {
  if (GPS.id !== null) { try { navigator.geolocation.clearWatch(GPS.id); } catch (e) { } }
  GPS.id = null;
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { tatGPS(); GPS.fix = null; }   // ẩn app thì dừng GPS cho đỡ hao pin, vị trí cũ bỏ đi
  else if (S.tab === 'home') { batGPS(); veGPS(); }
});
function layViTri(ok, fail) {
  if (gpsSan()) return ok(GPS.fix);
  batGPS();
  var xong = false, w;
  var tm = setTimeout(function () {
    if (xong) return; xong = true;
    GPS.cho = GPS.cho.filter(function (x) { return x !== w; });
    var g = GPS.fix;
    if (g && Date.now() - g.t < 60000) return ok(g);   // gửi bản tốt nhất, máy chủ sẽ báo nếu sai số quá lớn
    navigator.geolocation.getCurrentPosition(function (p) {
      ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() });
    }, fail, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }, 12000);
  w = { ok: function (f) { if (xong) return; xong = true; clearTimeout(tm); ok(f); },
        fail: function (e) { if (xong) return; xong = true; clearTimeout(tm); fail(e); } };
  if (GPS.loi && GPS.loi.code === 1 && GPS.id === null) {   // đã bị chặn: hỏi lại quyền một lần
    xong = true; clearTimeout(tm);
    return navigator.geolocation.getCurrentPosition(function (p) {
      batGPS(); ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() });
    }, fail, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }
  GPS.cho.push(w);
}

function theDon(x, i) {
  var cls = { 'Nghỉ không lương': 'kl', 'Đi muộn trời mưa': 'mua', 'Tạm ứng': 'ung', 'Bù công': 'bu' }[x.loai] || '';
  var pc = { 'Chờ duyệt': 'cho', 'Đã duyệt': 'duyet', 'Từ chối': 'tuchoi', 'Đã hủy': 'huy' }[x.tt];
  var kv = '';
  if (x.loai === LOAI.UNG) kv += '<dt>Số tiền</dt><dd class="b">' + tien(x.soTien) + ' đ</dd><dt>Nhận qua</dt><dd>' + esc(x.hinhThuc) + '</dd>' + (x.tk ? '<dt>Tài khoản</dt><dd>' + esc(x.tk) + '</dd>' : '');
  else if (x.loai === LOAI.MUA) kv += '<dt>Ngày</dt><dd>' + ngayVN(x.tu) + '</dd>';
  else kv += '<dt>Ngày áp dụng</dt><dd>' + ngayVN(x.tu) + (x.den !== x.tu ? ' → ' + ngayVN(x.den) : '') + '</dd><dt>Buổi</dt><dd>' + esc(x.buoiMoTa || x.buoi) + '</dd><dt>Thời gian</dt><dd>' + so(x.soNgay) + ' ngày</dd>';
  kv += '<dt>Lý do</dt><dd>' + esc(x.lyDo) + '</dd>';
  kv += '<dt>Người duyệt</dt><dd>' + esc(x.nguoiDuyet) + '</dd>';
  if (x.ghiChu) kv += '<dt>Ghi chú duyệt</dt><dd>' + esc(x.ghiChu) + '</dd>';
  var acts = '';

/* Giờ làm: vào ca → 11:45, 13:00 → ra ca (trừ nghỉ trưa) */
function phutHM(s) { var m = String(s || '').match(/(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : 0; }
function phutLam(tu, den) {
  var me = S.init.me, nt = S.init.nghiTrua || ['11:45', '13:00'];
  var k = [[phutHM(me.caVao || '08:00'), phutHM(nt[0])], [phutHM(nt[1]), phutHM(me.caRa || '17:00')]];
  return k.reduce(function (s, x) { return s + Math.max(0, Math.min(den, x[1]) - Math.max(tu, x[0])); }, 0);
}
/** Từ giờ – Đến giờ → Cả ngày / Sáng / Chiều (nửa ngày = 0,5) hoặc Theo giờ (quy đổi theo tỷ lệ) */
function buoiTuGio(tg, dg) {
  var me = S.init.me, nt = S.init.nghiTrua || ['11:45', '13:00'];
  var a = phutHM(tg), b = phutHM(dg), vao = phutHM(me.caVao || '08:00'), ra = phutHM(me.caRa || '17:00'), n1 = phutHM(nt[0]), n2 = phutHM(nt[1]);
  var p = b > a ? phutLam(a, b) : 0, mot = phutLam(0, 1440) || 465;
  var sangHet = a <= vao && b >= n1, chieuHet = a <= n2 && b >= ra;
  if (sangHet && chieuHet) return { buoi: 'Cả ngày', ngay: 1, phut: p };
  if (sangHet && b <= n2) return { buoi: 'Sáng', ngay: 0.5, phut: p };
  if (chieuHet && a >= n1) return { buoi: 'Chiều', ngay: 0.5, phut: p };
  return { buoi: 'Theo giờ', ngay: Math.min(1, Math.round(p / mot * 100) / 100), phut: p };
}
function gioPhut(p) { var h = Math.floor(p / 60), m = p % 60; return (h ? h + ' giờ' : '') + (m ? (h ? ' ' : '') + m + ' phút' : '') || '0 phút'; }
function chonLoai(l) { S.form.loai = l; capNhatForm(); }
function chonHT(h) { S.form.ht = h; $('htCK').classList.toggle('on', h === 'Chuyển khoản'); $('htTM').classList.toggle('on', h === 'Tiền mặt'); $('fTKBox').style.display = h === 'Chuyển khoản' ? 'block' : 'none'; }

  var ung = l === LOAI.UNG, mua = l === LOAI.MUA;
  $('fNgay').style.display = ung ? 'none' : 'block';

  var motNgay = $('fTu').value === $('fDen').value;

  $('fBuoiBox').style.display = 'none';                          // không còn ô chọn buổi: chỉ chọn Từ giờ – Đến giờ
  $('fGioBox').style.display = (choGio && motNgay) ? 'block' : 'none';
  var tong = $('fTong');

function dinhDangTien(el) { var v = el.value.replace(/\D/g, ''); el.value = v ? Number(v).toLocaleString('vi-VN') : ''; }
function chonAnh(inp) {

function nenAnh(file) {

      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

}

function locTatCa(on) { locHienThi().forEach(function (n) { var i = S.blTam.indexOf(n.ma); if (on && i < 0) S.blTam.push(n.ma); if (!on && i >= 0) S.blTam.splice(i, 1); }); veLocBL(); }
function apLocBL() { S.blChon = S.blTam.length === S.blNV.length ? [] : S.blTam.slice(); dongModal(); veBL(); }

function blPham() { return S.blChon.length ? 'cho ' + S.blChon.length + ' nhân sự đã chọn' : 'cho tất cả nhân sự'; }
function blTinh() {

function blThuThap() {

  if (laIOS() && !daCaiManHinh()) { el.innerHTML = '<div class="card sm"><b>🔔 Muốn nhận thông báo?</b><br>Bấm nút Chia sẻ của Safari → <b>Thêm vào MH chính</b>, rồi mở app từ biểu tượng trên màn hình chính.</div>'; return; }
  if (!hoTroTB()) { el.innerHTML = ''; return; }
  if (Notification.permission === 'denied') { el.innerHTML = '<div class="card sm"><b>🔕 Thông báo đang bị chặn.</b><br>Vào Cài đặt điện thoại → Thông báo → cho phép app Chấm công.</div>'; return; }
  if (daBatTB()) { el.innerHTML = '<div class="card sm row"><div class="sp">🔔 Đã bật thông báo</div><button class="btn o sm" onclick="thuTB()">Gửi thử</button></div>'; dangKyTB(true); return; }
  el.innerHTML = '<div class="card"><div class="b">🔔 Bật thông báo</div><div class="sm mu" style="margin:4px 0 10px">Nhận báo ngay khi có đơn cần duyệt, đơn được duyệt hoặc có phiếu lương.</div><button class="btn w" onclick="batTB()">Bật thông báo</button></div>';
}
function khoiTaoFB() {
  if (TB.msg) return Promise.resolve(TB.msg);
  if (!firebase.apps.length) firebase.initializeApp(CFG.firebase);
  return navigator.serviceWorker.register('firebase-messaging-sw.js').then(function (reg) {
    TB.swReg = reg; TB.msg = firebase.messaging();
    // App đang mở trên màn hình: vẫn hiện thông báo của hệ thống (không chỉ dòng chữ trong app)
    TB.msg.onMessage(function (p) {
      var n = (p && (p.notification || p.data)) || {};
      try { TB.swReg.showNotification(n.title || 'Chấm công Thành Tâm', { body: n.body || '', icon: 'icon-192.png', badge: 'icon-192.png' }); } catch (e) { }
      toast((n.title || 'Thông báo') + (n.body ? ': ' + n.body : ''));
      if (S.tab === 'don') veDon();
    });
    return TB.msg;
  });
}
function dangKyTB(imLang) {
  return khoiTaoFB().then(function (m) {
    return navigator.serviceWorker.ready.then(function () { return m.getToken({ vapidKey: CFG.vapidKey, serviceWorkerRegistration: TB.swReg }); });
  }).then(function (tk) {
    if (!tk) throw new Error('Không lấy được mã thông báo.');
    if (imLang && TB.daGui === tk) return;   // mỗi lần mở app gửi lại mã 1 lần → máy chủ luôn có mã đúng
    return call('dangKyThongBao', { token: tk, ua: navigator.userAgent }, imLang).then(function () {
      TB.daGui = tk;
      try { localStorage.setItem('tt_cc_tbtk', tk); localStorage.setItem('tt_cc_tb', S.init.me.ma); } catch (e) { }
    });
  }).catch(function (e) { if (!imLang) throw e; });
}
function batTB() {
  Notification.requestPermission().then(function (p) {
    if (p !== 'granted') { toast('Bạn chưa cho phép thông báo', 1); veTB(); return; }
    loading(true);
    return dangKyTB(false).then(function () { loading(false); toast('Đã bật thông báo'); veTB(); thuTB(); });
  }).catch(function (e) { loading(false); toast(e.message || 'Không bật được thông báo', 1); });
}
function thuTB() { TB.daGui = ''; dangKyTB(false).then(function () { return call('thuThongBao', {}, true); }).then(function (r) { toast('Đã gửi thử tới ' + r.soMay + ' máy'); }).catch(function (e) { toast(e.message, 1); }); }
if (hoTroTB()) { try { khoiTaoFB().catch(function () { }); } catch (e) { } }

batDau();
</script>
